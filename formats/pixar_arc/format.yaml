# Pixar-style character arc: the original VidGen format.
#
# Everything here used to be hardcoded in the pipeline or set in config.yaml. Settings are layered
#   config.yaml  <  this file  <  config.local.yaml  <  environment variables
# so a machine-local file can still override any of them.
#
# Prompt text lives next to this file and is sent to Claude as written:
#   script_prompt.md   the system prompt for the script step ({{NAME}} placeholders are filled in)
#   shot_rules.md      image / video prompt rules, inserted at {{SHOT_RULES}}
#   blocks/            app_screens.md (screenshots available) / no_app_screens.md (none)

name: pixar_arc
title: "Pixar Arc"                       # shown in the UI's format gallery
description: >-
  3D animated character arc: a dumped, fired hero locks in with Iro, grinds a counter up,
  wins far past the goal, turns down his ex, then a flex montage and the SEARCH IRO AI ending.
duration_target: "about 40-70 seconds"   # informational; the shot rules below set the real length
aspect: "9:16"
resolution: [1080, 1920]                 # width, height of the final video
fps: 30
clip_seconds: 4                          # length of each image-to-video clip (fal and Sume)
cast: locked                             # locked: use locked_characters below | none: no fixed cast

# The story, beat by beat (the prompt in script_prompt.md spells each one out).
beats:
  - loss + insult
  - rock bottom
  - Iro mentor, hero opens the app
  - the bet
  - grind with a climbing counter
  - overshoot win
  - flex
  - the ex returns
  - "\"i'm good\" with the new girl"
  - "\"that's my boy\""
  - flex montage
  - CTA

# Prepended word for word to every image_prompt.
style: "3D animated feature film style, soft cinematic lighting, warm saturated colors, vertical 9:16"

# Upper bound on shots marked animate: true. Everything else stays a still.
max_animated_shots: 8

# What the script validator enforces (and the prompt quotes).
rules:
  story_shots: [15, 22]          # shots, not counting the montage
  vo_words: [60, 100]            # total spoken words across all shots (montage excluded)
  caption_max_words: 2           # captions are 1-2 words, except the CTA caption
  cta_caption: "SEARCH IRO AI"   # required caption on the final shot
  narrator: false                # every spoken line belongs to a character
  cards:                         # time-jump cards
    count: [1, 3]
    words: [2, 4]
  montage:                       # consecutive shots right before the final CTA shot
    name: "FLEX MONTAGE"
    count: [6, 8]
  app_screens:                   # real screenshots in a phone mockup
    max: 2
    hint: "one right after the hero opens the app, optionally one in the grind"
  # Wording that asks the image model to draw the Iro app. The mascot's own name is fine.
  banned_image_prompt:
    fix: "show the back of the phone with the screen glow on their face"
    patterns:
      - ['\biro\s*ai\b', "the app name 'Iro AI'"]
      - ['\biro\s+app\b', "'Iro app'"]
      - ['\bapp(''s)?\s+(ui|interface|screen|logo|icon|name|home ?screen|menu|dashboard)\b', "app UI"]
      - ['\buser interface\b', "'user interface'"]
      - ['\bui\b', "'UI'"]
      - ['\blogos?\b', "a logo"]
      - ['\bscreen\s+(shows|showing|displays|displaying|reads|reading)\b', "what a screen shows"]
  # Lines that sound written by AI, from the viral-video-writing skill's checker
  # (skills/viral-video-writing/scripts/score.py). Matched on the lower-cased vo_line.
  banned_vo_line:
    fix: "rewrite it the way a person says it out loud"
    patterns:
      - ['—', "an em dash"]
      - [';', "a semicolon"]
      - ['\bnot just\b.*\bbut\b', '"not just X but Y"']
      - ['\bit[''’]?s not (?:about )?\w+[^.]*?, it[''’]?s\b', '"it''s not X, it''s Y"']
      - ['here[''’]?s the thing|let that sink in|read the (?:tiny|fine) print|the truth is|in today[''’]?s|buckle up|imagine this|it[''’]?s worth noting|at the end of the day|whether you[''’]?re a', "filler"]
      - ['\b(?:spoiler|plot twist)\s*:|here[''’]?s where it gets interesting|the best part\?', "fake suspense"]
      - ['\b(?:delve|unlock|unleash|harness|leverage|seamless|robust|cutting[- ]edge|game[- ]?changer|revolutionary|transformative|landscape|realm|tapestry|elevate|empower|supercharge|deep dive|next level|dive in)\b', "an AI word"]
      - ['\b(?:panic button|goldmine|secret sauce)\b', "a metaphor punchline"]

# How the app-screen list is written into blocks/app_screens.md ({{SCREEN_LIST}}).
prompt:
  app_screen_line: '            * "{{PATH}}": {{SHOWS}}'
  app_screen_unknown: "an Iro app screen"   # when a screenshot has no `shows`

# Captions burned into the final video.
captions:
  font: "Montserrat Black Italic"
  font_file: "assets/fonts/Montserrat-BlackItalic.ttf"   # bundled (SIL OFL); loaded by libass directly
  fallback_font: "Arial Black"
  size: 90
  y: 0.55                        # vertical centre of the caption, fraction of height
  max_words: 1                   # words per caption chunk (one word at a time, karaoke style)
  fill: "&H00FFFFFF"             # ASS colours, &HAABBGGRR
  outline_color: "&H00E6C8FF"    # pink-white
  outline: 5                     # outline 5 + blur 6 = soft glow
  blur: 6
  pop_from: 85                   # pop-in: scale 85% -> 100%
  pop_ms: 80                     #   over this many milliseconds
  card_fade_ms: 200              # time-jump card text fades in and out over this long

# Colour grade applied after the captions: desaturate, then a slight cool tint.
grade:
  saturation: 0.85
  colorbalance: "rs=-0.03:bs=0.04:rm=-0.02:bm=0.03:rh=-0.01:bh=0.02"

# Shot lengths and camera moves in the assembled cut.
timing:
  vo_pad_seconds: 0.25           # shot length = VO length + this
  min_shot_seconds: 1.2
  zoom_end: 1.08                 # still shots push in from 1.00 to this
  card_seconds: 1.5              # time-jump cards: black screen with the card text
  app_screen_seconds: 1.5        # app_screen shots: real screenshot in a phone mockup
  app_screen_zoom_end: 1.04      # slight push-in on the mockup, from 1.00 to this
  montage_seconds: 0.5           # flex montage: each shot this long, hard cuts
  montage_zoom_end: 1.12         # quick punch-in on each montage shot, from 1.00 to this

# Real Iro app screenshots. The image model never draws the app; a shot with "app_screen"
# shows one of these inside a phone mockup instead. `shows` tells the script writer what is on
# screen. The script step only offers files that exist.
app_screens:
  - path: assets/screens/learn.jpg
    shows: "the learning path map with the next lesson card and a START button (a first lesson)"
  - path: assets/screens/lesson.jpg
    shows: "a lesson in progress: Iro asks the learner to match AI tools to what they do best"
  - path: assets/screens/progress.jpg
    shows: "the progress screen: Gold II rank, XP bar and the six-skill operator build"
  - path: assets/screens/create.jpg
    shows: "the create screen for building a custom learning path on any topic"

# Recurring cast. Descriptions are physical identity only (no clothing); the script step
# reuses them word for word and adds a scene-appropriate outfit per shot. The validator
# rejects a script that alters a description. A character whose look depends on their
# clothes can have an optional `outfit:` line: how they always dress, in every scene. image_path is a reference image for later
# steps (empty = none yet; Iro's points to the app icon).
locked_characters:
  - id: marcus
    role: hero
    description: "a 26 year old man with messy dark brown hair, light stubble, warm tan skin, an athletic build"
    image_path: ""
  - id: jess
    role: love interest / the ex who leaves
    description: "a 26 year old woman with long wavy brown hair, green eyes, small gold hoop earrings"
    image_path: ""
  - id: tyler
    role: rival / doubter
    description: "a 28 year old man with slick blond hair and a smug grin"
    image_path: ""
  - id: iro
    role: mentor, the Iro AI mascot, never a human
    description: "Iro, a small round robotic penguin mascot with glossy black and gold armor, big round eyes, and a glowing orange core on its chest"
    image_path: "assets/iro.png"
  - id: boss
    role: the boss, only ever delivers the firing
    description: "a 50 year old man with slicked-back grey hair, a square jaw, light skin, and cold blue eyes"
    image_path: ""
  - id: sofia
    role: new partner in the reversal
    description: "a 25 year old goth woman with long straight jet-black hair and blunt bangs, very pale skin, dark winged eyeliner, black lipstick, a black spiked choker, and a curvy hourglass figure"
    outfit: "all black goth outfits that fit the scene, such as a fitted black dress with sheer black sleeves and a black corset belt for a night out, or a black swimsuit with a sheer black cover-up at the beach. Never colourful or pastel clothes"
    image_path: ""
