# Pixar Revenge: the same cast and look as Pixar Arc, told almost without words.
#
# Taken from the breakup-revenge videos that pass 5-10M views: a public rejection, she leaves
# with a richer man, a flashback to her promise, his face hardens, the grind in quick flashes,
# a time card, the reunion and ONE comeback line. About 40-45 seconds and only 20-45 words.
#
# Everything not listed here comes from formats/pixar_arc/format.yaml.

name: pixar_revenge
extends: pixar_arc
title: "Pixar Revenge"
description: >-
  A public rejection, she leaves with a richer man, a flashback to her promise, the grind in
  quick flashes, a time card, the reunion and one comeback line. Almost no dialogue.
duration_target: "about 40-45 seconds"

# The videos this format is modelled on (shown in the UI under Format details).
references:
  - url: "https://www.instagram.com/reel/DeV-XBfgvTC/"
    note: "Paris proposal, 9.8M views: 'Hell no', the older man's Rolls, '2 years later', 'can't hear you'"
  - url: "https://www.instagram.com/reel/DehudnaAmce/"
    note: "The wedding, 4.6M views: 'Hell no' at the altar, the grind in flashes, 'Sorry, I'm fully booked'"

beats:
  - public rejection ("hell no")
  - she leaves with the rival
  - alone, flashback to her promise
  - the turn: Iro, the app
  - the grind in flashes
  - the new life
  - time card
  - the reunion and one comeback line
  - flex montage (the last shot is the end)

rules:
  # The story ends on the montage's last shot, with no "search the app" shot after it: the app
  # is shown at the turn. Set to true (or delete the line) for a closing shot captioned with
  # cta_caption again.
  closing_shot: false
  story_shots: [14, 24]          # shots, not counting the flashes and the montage
  vo_words: [20, 45]             # the pictures tell it; the words are few
  silent_run_max: 6
  cards:                         # one before the flashback, one before the reunion
    count: [2, 2]
    words: [2, 4]
  flashes:                       # the grind: half a second each, hero in the centre
    name: "GRIND"
    count: [8, 12]
    animate: true                # each flash is a clip: he types, writes, turns. As stills they read as a slideshow
  montage:
    name: "FLEX MONTAGE"
    count: [4, 5]
  app_screens:
    max: 1
    hint: "exactly one, at the turn"
  labels: true                   # OPENS IRO on the app
  label_max_words: 3

# Captions: two or three words at a time, a little larger, as in Pixar Mirror. A video can
# choose its own words at a time and size in its Captions panel.
captions:
  max_words: 3
  size: 92

timing:
  min_shot_seconds: 1.8          # silent shots carry an action, so they get time to play
  montage_seconds: 0.6
  flash_seconds: 0.5             # long enough to see him move
  # A recording of the app plays this long at most when nothing is said over it (the default
  # is 6). The story stops while the phone is up; on the first video made this way a third of
  # the viewers still watching left during a 4.6 second app shot.
  app_clip_max_seconds: 2.0

prompt:
  app_screen_line: '    * "{{PATH}}": {{SHOWS}}'
