# Pixar Mirror: the same cast and look as Pixar Arc, a different story shape.
#
# Taken from short app ads that tell the story twice: a small public humiliation, the app, three
# progress shots with a rank and a climbing number, a time card, then the SAME scene again with
# the roles reversed. About 45-55 seconds, 45-90 spoken words.
#
# Everything not listed here (cast, style, captions, grade, app screenshots, the banned
# wording) comes from formats/pixar_arc/format.yaml. This folder has its own script_prompt.md,
# shot_rules.md and blocks/app_screens.md.

name: pixar_mirror
extends: pixar_arc
title: "Pixar Mirror"
description: >-
  A small public humiliation, the hero opens Iro, three progress shots with his rank and a
  climbing number, a time card, then the same scene replayed with the roles reversed.
duration_target: "about 45-55 seconds"

# The videos this format is modelled on (shown in the UI under Format details).
references:
  - url: "https://www.instagram.com/reel/DexjmDmBOw0/"
    note: "RepStandard, the wingman: 'Be my wingman' comes back six months later with the roles swapped"
  - url: "https://www.instagram.com/reel/De79Dn5hIfg/"
    note: "RepStandard, the keys: 'You dropped your keys', then she drops them on purpose"

beats:
  - small public humiliation (5-7 lines)
  - "\"enough is enough\", alone"
  - the app in his hand
  - three progress shots (rank + number)
  - time card
  - the same scene, roles reversed
  - flex montage (the last shot is the end)

rules:
  # The story ends on the montage's last shot. The ads this copies have no "search the app"
  # card at the end: the app is shown in the story, and that is the advertising. Set this to
  # true (or delete the line) to end on a closing shot captioned with cta_caption again.
  closing_shot: false
  story_shots: [20, 28]          # shots, not counting the montage
  vo_words: [45, 90]             # total spoken words across all shots
  silent_run_max: 2
  cards:
    count: [1, 1]                # one time jump, between the grind and the replay
    words: [2, 4]
  montage:
    name: "FLEX MONTAGE"
    count: [5, 6]
  app_screens:
    max: 1
    hint: "exactly one, right after the hero decides to change"
  # The grind: shots with "stat" get the rank and a big number drawn over them (see README,
  # Progress overlay). Ranks are Iro's own, lowest first; units are what the number counts.
  stats:
    count: [3, 3]
    ranks: [BRONZE, SILVER, GOLD, PLATINUM, DIAMOND, IRIDESCENT]
    units: ["DAY STREAK", "LESSONS", "XP"]
  mirror_lines_min: 2            # lines of the second scene that repeat a line of the first
  labels: true                   # small stage directions on screen: *OPENS IRO*
  label_max_words: 4

# The small stage-direction tag: dark italic text on a white box in the lower third, with an
# asterisk on each side.
# Captions: two or three words at a time, as in the ads this copies (Pixar Arc shows one).
# The ads' own captions are about half as big again as this; 92 is a step toward them that
# still leaves the faces clear. A video can choose its own words at a time (1, 2 or 3) and its
# own size (small to extra large) in its Captions panel.
captions:
  max_words: 3
  size: 92

labels:
  y: 0.74
  size: 40
  text: "#111111"
  box: "#FFFFFF"
  wrap: "*"

# The progress overlay on the three grind shots.
stat:
  eyebrow: "IRO RANK"            # the small heading over the rank

# Colour: as the pictures come. Pixar Arc takes the colour down and tints it cool; the reels this
# format follows are bright, warm and saturated, and next to them ours looked grey.
grade:
  saturation: 1.0
  colorbalance: ""

timing:
  montage_seconds: 0.8           # the flex shots sit a little longer here than in Pixar Arc
  # A recording of the app plays this long at most when nothing is said over it (the default
  # is 6). The story stops while the phone is up; on the first video made this way a third of
  # the viewers still watching left during a 4.6 second app shot.
  app_clip_max_seconds: 2.0

prompt:
  app_screen_line: '    * "{{PATH}}": {{SHOWS}}'
