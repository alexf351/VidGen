# Letter ad: a handwritten letter appears line by line over a quiet photo (S tier).
# The letter card is drawn at assembly (assemble.letter_*); only the backgrounds use the
# image model, and shots can share one background.
name: letter_ad
title: Letter Ad
description: A personal letter, handwritten line by line over a quiet photo, read aloud.
duration_target: about 20-35 seconds
aspect: '9:16'
resolution:
- 1080
- 1920
fps: 30
clip_seconds: 4
cast: none
beats:
- Dear ...
- what they used to feel
- the moment it changed
- what they do now
- the wish for the reader
- P.S. Search Iro AI
style: candid smartphone photo, natural soft light, quiet everyday scene, muted warm colors, shallow depth
  of field, vertical 9:16
max_animated_shots: 0
rules:
  story_shots:
  - 6
  - 10
  vo_words:
  - 45
  - 120
  caption_max_words: 2
  cta_caption: SEARCH IRO AI
  narrator: true
  letter: true
  banned_image_prompt:
    fix: show the back of the phone with the screen glow on their face
    patterns:
    - - \biro\s*ai\b
      - the app name 'Iro AI'
    - - \biro\s+app\b
      - '''Iro app'''
    - - \bapp('s)?\s+(ui|interface|screen|logo|icon|name|home ?screen|menu|dashboard)\b
      - app UI
    - - \buser interface\b
      - '''user interface'''
    - - \bui\b
      - '''UI'''
    - - \blogos?\b
      - a logo
    - - \bscreen\s+(shows|showing|displays|displaying|reads|reading)\b
      - what a screen shows
  banned_vo_line:
    fix: rewrite it the way a person says it out loud
    patterns:
    - - —
      - an em dash
    - - ;
      - a semicolon
    - - \bnot just\b.*\bbut\b
      - '"not just X but Y"'
    - - \bit['’]?s not (?:about )?\w+[^.]*?, it['’]?s\b
      - '"it''s not X, it''s Y"'
    - - here['’]?s the thing|let that sink in|read the (?:tiny|fine) print|the truth is|in today['’]?s|buckle
        up|imagine this|it['’]?s worth noting|at the end of the day|whether you['’]?re a
      - filler
    - - \b(?:spoiler|plot twist)\s*:|here['’]?s where it gets interesting|the best part\?
      - fake suspense
    - - \b(?:delve|unlock|unleash|harness|leverage|seamless|robust|cutting[- ]edge|game[- ]?changer|revolutionary|transformative|landscape|realm|tapestry|elevate|empower|supercharge|deep
        dive|next level|dive in)\b
      - an AI word
    - - \b(?:panic button|goldmine|secret sauce)\b
      - a metaphor punchline
prompt:
  app_screen_line: '  * "{{PATH}}": {{SHOWS}}'
  app_screen_unknown: an Iro app screen
captions:
  font: Montserrat Black Italic
  font_file: assets/fonts/Montserrat-BlackItalic.ttf
  fallback_font: Arial Black
  size: 72
  y: 0.9
  max_words: 2
  fill: '&H00FFFFFF'
  outline_color: '&H00E6C8FF'
  outline: 5
  blur: 6
  pop_from: 85
  pop_ms: 80
  card_fade_ms: 200
grade:
  saturation: 1.0
  colorbalance: ''
timing:
  vo_pad_seconds: 0.5
  min_shot_seconds: 2.0
  zoom_end: 1.08
  card_seconds: 1.5
  app_screen_seconds: 1.5
  app_screen_zoom_end: 1.04
  montage_seconds: 0.5
  montage_zoom_end: 1.12
letter:
  font_file: assets/fonts/Caveat.ttf
  font_size: 66
  weight: 500
  paper: '#FBF7EE'
  ink: '#26232D'
  rule: '#9DB4D6'
  width: 0.84
  bg_blur: 2
  bg_dim: 0.8
  read_wps: 3.0
  zoom_end: 1.03
app_screens: []
