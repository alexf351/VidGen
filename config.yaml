# VidGen configuration
#
# Machine and provider settings. Everything that defines a kind of video (story beats, prompt
# text, cast, style line, aspect, clip length, captions, grade, shot timing) lives in the video
# format: formats/<name>/format.yaml, picked with  python main.py new "..." --format <name>
# (default pixar_arc). Layering: this file < the format < config.local.yaml < env vars.

# ElevenLabs voice id used when a speaker has no entry in `voices` below.
voice_id: "21m00Tcm4TlvDq8ikWAM"

# speaker -> ElevenLabs voice id. Empty = fall back to voice_id above.
voices:
  narrator: ""
  marcus: ""
  jess: ""
  tyler: ""
  iro: ""
  boss: ""
  sofia: ""

elevenlabs:
  model_id: "eleven_multilingual_v2"
  output_format: "mp3_44100_128"
  cost_per_1k_chars: 0.22        # USD per 1000 characters, for the running estimate

# Machine-specific settings (API keys, ffmpeg location, output folder, providers) go in
# config.local.yaml, which is merged over this file and not committed. Start from
# config.local.example.yaml. Environment variables override both files.
ffmpeg_path: ""                 # empty = find ffmpeg on PATH; ffprobe comes from the same folder
output_dir: "runs"              # where runs are written; relative to the repo or absolute

# Background music mixed under the final cut, for a video that has not chosen its own in the
# Music panel (README: Music and levels). Empty = no music bed.
music_path: ""

# Short clip appended after the last shot. Empty = none.
outro_path: ""

assemble:
  music_volume: 0.06            # music bed level under the voice; 0.15 drowned it out
                                # (aspect, captions, grade and shot timing are set by the format)
  # The caption look for new videos: classic | outline | yellow_pop | comic | headline | banner |
  # off. Empty = each format's own look. You can also pick one per video on the create screen.
  caption_style: ""

# Every drawn shot becomes a video clip instead of a still with a slow zoom. Each format decides
# (Pixar Arc: on). Uncomment to force it for every format (true) or to animate only the key
# shots everywhere (false). Clips are most of a video's cost.
# animate_all: false

# Sound effects mixed under the voice: a whoosh on a change of scene, a hit on a time card, a
# riser into the montage, a pop on an app screen. Each format decides whether it has them
# (Pixar Arc: on); add `enabled: true` or `enabled: false` here to decide for every format.
# To use your own sounds, put whoosh / swish / impact / pop / riser (.wav or .mp3) in assets/sfx/.
sfx:
  source: auto                  # auto = ElevenLabs Sound Effects when its key is set (five short
                                # sounds, made once and reused), else built in | elevenlabs | builtin
  volume: 1.0                   # all effects together; 0.5 = half as loud
  cuts: true                    # a soft swish on every cut, not only on scene changes; false = cuts
                                # inside a scene stay clean

# Clip sound: the video model makes every clip with its own sound. People say their lines with
# lips that match, and a door slams when it shuts (see clip_sound.py and the README). The voices
# are then the model's own, not the ElevenLabs voices; a line the clip gets wrong is still spoken
# by the ElevenLabs voice. One video can switch it on or off for itself on its run page.
clip_sound:
  enabled: false
  level: 0.8                    # how loud a shot's own sound plays when nobody speaks in it
  match: 0.7                    # how much of a line must be heard in its clip (0-1) to use the clip's voice
  model: scribe_v2              # the ElevenLabs model that finds the words in a clip

script:
  model: "claude-sonnet-5-5"
  # The cap on one reply. The model thinks before it writes and the thinking counts toward this
  # too, so it needs room for both (you pay only for what is used, not for the cap).
  max_tokens: 64000
  # How hard the model thinks: low | medium | high | xhigh | max. Empty = the model's default.
  effort: ""

# python main.py import-skill: converts a Claude skill into a format (one call per import,
# a second only if the first result does not fit the format schema).
import_skill:
  model: "claude-opus-5-5"
  max_tokens: 64000
  effort: "high"                # low | medium | high | xhigh | max

# Generated reference sheets for locked characters are cached here (repo root) and
# reused by every later run.
characters_cache_dir: "characters_cache"

# Which service generates the images and the video clips. Sume is the default (about half the
# price of fal for the same models); set either to fal here or in config.local.yaml to use fal.
providers:
  images: sume                  # sume | fal
  video: sume                   # sume | fal

fal:
  # Keyframes: text-to-image for shots with no characters, edit (reference images) otherwise.
  image_model: "fal-ai/nano-banana"
  image_edit_model: "fal-ai/nano-banana/edit"
  image_cost: 0.0398            # USD per image, for the running estimate

  # Image-to-video for shots marked animate: true. Clip length comes from the format
  # (clip_seconds); set video_seconds here or in config.local.yaml to override it (4-15).
  video_model: "bytedance/seedance-2.0/fast/image-to-video"
  video_resolution: "480p"      # 480p | 720p (assemble scales to 1080x1920 either way)
  video_audio: false            # generate_audio
  # USD per second of output, by resolution, for the cost estimates.
  # 720p is the rate published on the fal.ai model page. fal does not publish a 480p rate, so
  # it is derived from fal's own token formula, tokens = w * h * seconds * 24 / 1024 at
  # $0.0112 per 1k tokens, which reproduces the 720p rate exactly at 720x1280. At 480p the
  # 9:16 frame is 496x864: 10,044 tokens per second = $0.1125.
  video_cost_per_second:
    480p: 0.1125
    720p: 0.2419

# Sume (sume.com/docs), used only where providers.* says sume. Prices are Sume's published
# rates (sume.com/sume-api/pricing); Sume bills at the provider's price with no markup.
sume:
  base_url: "https://api.sume.com"
  image_model: "nano-banana"    # one id for text-to-image and reference-image edits
  image_cost: 0.039             # USD per image
  video_model: "seedance-2-fast"
  video_resolution: "480p"      # 480p | 720p
  video_audio: false            # generate_audio
  video_cost_per_second:        # USD per second of output, by resolution
    480p: 0.056246
    720p: 0.12096
  # Sume caps in-flight jobs per workspace (2 with no funds added in 28 days, more as you add
  # funds; images and videos share the cap). Requests over it are refused, not queued.
  max_concurrent: 2             # jobs VidGen runs at once
  # nano-banana on Sume takes at most 3 reference pictures in one request ("This model accepts at
  # most 3 reference images"). A shot's character sheets come first; what is left goes to the
  # earlier shot of its scene that keeps the place and the clothes.
  max_reference_images: 3
  retry_window_seconds: 600     # keep retrying over-limit / busy refusals for this long
  retry_base_seconds: 5         # first wait between retries, doubling up to 60s
  job_timeout_seconds: 900      # stop polling one job after this long

# The Claude Code engine (formats with a code_render block; pick it on the create screen or with
# `new --engine claude_code`). Claude Code codes every scene and the video renders on this
# computer, using your Claude login (run `claude auth login` once). Needs node + npm + claude.
code_engine:
  claude_path: ""               # empty: find `claude` on PATH
  node_path: ""                 # empty: find `node` on PATH
  model: ""                     # empty: Claude Code's default for your plan; or opus / sonnet
  story_max_turns: 20
  scenes_max_turns: 120
  timeout_minutes: 60           # one Claude Code session
  render_timeout_minutes: 90    # software rendering of the 3D styles is slow off a Mac
  voice: true                   # read the lines with ElevenLabs when ELEVENLABS_API_KEY is set

# Talking shots (formats with rules.talking) and songs (rules.song). These extend the fal and
# elevenlabs blocks above; defaults shown.
# fal:
#   avatar_model: "fal-ai/kling-video/ai-avatar/v2/standard"   # image + voice line -> lip-synced clip
#   avatar_cost_per_second: 0.0562                             # USD per second of speech (Standard)
# elevenlabs:
#   music_model: "music_v2"              # music_v1 | music_v2 | music_v2_5
#   music_output_format: "mp3_44100_128"
#   music_cost_per_minute: 0.30          # USD; check your ElevenLabs plan and set it here

# Voice casting: speakers with no voice in `voices:` (the people a format invents for one video)
# get a fitting voice from your ElevenLabs account, by gender and age, a different one each.
# Swap any of them on the run page. Add voices you like to "My Voices" on elevenlabs.io.
voice_casting:
  enabled: true
  exclude: []                   # voice ids never to cast
