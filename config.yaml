# VidGen configuration

# Prepended word-for-word to every image_prompt in the script.
style: "3D animated feature film style, soft cinematic lighting, warm saturated colors, vertical 9:16"

# ElevenLabs voice id used for narration by default.
voice_id: "21m00Tcm4TlvDq8ikWAM"

# Background music mixed under the final cut.
music_path: "assets/music.mp3"

# Short clip appended after the last shot.
outro_path: "assets/outro.mp4"

# Upper bound on shots marked animate: true. Everything else stays a still.
max_animated_shots: 8

# Recurring cast. Descriptions are physical identity only (no clothing); the script step
# reuses them word for word and adds a scene-appropriate outfit per shot. The validator
# rejects a script that alters a description. image_path is a reference image for later
# steps (empty = none yet; Iro's will point to the app icon).
locked_characters:
  - id: marcus
    role: hero
    description: "a 26 year old man with messy dark brown hair, light stubble, warm tan skin, an athletic build"
    image_path: ""
  - id: jess
    role: love interest / the ex who leaves
    description: "a 26 year old woman with long wavy brown hair, green eyes, small gold hoop earrings"
    image_path: ""
  - id: tyler
    role: rival / doubter
    description: "a 28 year old man with slick blond hair and a smug grin"
    image_path: ""
  - id: iro
    role: mentor, the Iro AI mascot, never a human
    description: "Iro, a small round robotic penguin mascot with glossy black and gold armor, big round eyes, and a glowing orange core on its chest"
    image_path: ""

script:
  model: "claude-sonnet-5-5"
  max_tokens: 16000

# Generated reference sheets for locked characters are cached here (repo root) and
# reused by every later run.
characters_cache_dir: "characters_cache"

fal:
  # Keyframes: text-to-image for shots with no characters, edit (reference images) otherwise.
  image_model: "fal-ai/nano-banana"
  image_edit_model: "fal-ai/nano-banana/edit"
  image_cost: 0.0398            # USD per image, for the running estimate

  # Image-to-video for shots marked animate: true.
  video_model: "bytedance/seedance-2.0/fast/image-to-video"
  video_seconds: 4              # 4-15
  video_resolution: "720p"      # 480p | 720p
  video_audio: false            # generate_audio
  video_cost_per_second: 0.2419 # USD per second of 720p output, for the running estimate
