# VidGen configuration
#
# Machine and provider settings. Everything that defines a kind of video (story beats, prompt
# text, cast, style line, aspect, clip length, captions, grade, shot timing) lives in the video
# format: formats/<name>/format.yaml, picked with  python main.py new "..." --format <name>
# (default pixar_arc). Layering: this file < the format < config.local.yaml < env vars.

# ElevenLabs voice id used when a speaker has no entry in `voices` below.
voice_id: "21m00Tcm4TlvDq8ikWAM"

# speaker -> ElevenLabs voice id. Empty = fall back to voice_id above.
voices:
  narrator: ""
  marcus: ""
  jess: ""
  tyler: ""
  iro: ""
  boss: ""
  sofia: ""

elevenlabs:
  model_id: "eleven_multilingual_v2"
  output_format: "mp3_44100_128"
  cost_per_1k_chars: 0.22        # USD per 1000 characters, for the running estimate

# Machine-specific settings (API keys, ffmpeg location, output folder, providers) go in
# config.local.yaml, which is merged over this file and not committed. Start from
# config.local.example.yaml. Environment variables override both files.
ffmpeg_path: ""                 # empty = find ffmpeg on PATH; ffprobe comes from the same folder
output_dir: "runs"              # where runs are written; relative to the repo or absolute

# Background music mixed under the final cut. Empty = no music bed (add it on-platform).
music_path: ""

# Short clip appended after the last shot. Empty = none.
outro_path: ""

assemble:
  music_volume: 0.15            # music bed level under the voice (aspect, captions, grade and
                                # shot timing are set by the format)

script:
  model: "claude-sonnet-5-5"
  max_tokens: 16000

# Generated reference sheets for locked characters are cached here (repo root) and
# reused by every later run.
characters_cache_dir: "characters_cache"

# Which service generates the images and the video clips. Both default to fal.
providers:
  images: fal                   # fal | sume
  video: fal                    # fal | sume

fal:
  # Keyframes: text-to-image for shots with no characters, edit (reference images) otherwise.
  image_model: "fal-ai/nano-banana"
  image_edit_model: "fal-ai/nano-banana/edit"
  image_cost: 0.0398            # USD per image, for the running estimate

  # Image-to-video for shots marked animate: true. Clip length comes from the format
  # (clip_seconds); set video_seconds here or in config.local.yaml to override it (4-15).
  video_model: "bytedance/seedance-2.0/fast/image-to-video"
  video_resolution: "480p"      # 480p | 720p (assemble scales to 1080x1920 either way)
  video_audio: false            # generate_audio
  # USD per second of output, by resolution, for the cost estimates.
  # 720p is the rate published on the fal.ai model page. fal does not publish a 480p rate, so
  # it is derived from fal's own token formula, tokens = w * h * seconds * 24 / 1024 at
  # $0.0112 per 1k tokens, which reproduces the 720p rate exactly at 720x1280. At 480p the
  # 9:16 frame is 496x864: 10,044 tokens per second = $0.1125.
  video_cost_per_second:
    480p: 0.1125
    720p: 0.2419

# Sume (sume.com/docs), used only where providers.* says sume. Prices are Sume's published
# rates (sume.com/sume-api/pricing); Sume bills at the provider's price with no markup.
sume:
  base_url: "https://api.sume.com"
  image_model: "nano-banana"    # one id for text-to-image and reference-image edits
  image_cost: 0.039             # USD per image
  video_model: "seedance-2-fast"
  video_resolution: "480p"      # 480p | 720p
  video_audio: false            # generate_audio
  video_cost_per_second:        # USD per second of output, by resolution
    480p: 0.056246
    720p: 0.12096
  # Sume caps in-flight jobs per workspace (2 with no funds added in 28 days, more as you add
  # funds; images and videos share the cap). Requests over it are refused, not queued.
  max_concurrent: 2             # jobs VidGen runs at once
  retry_window_seconds: 600     # keep retrying over-limit / busy refusals for this long
  retry_base_seconds: 5         # first wait between retries, doubling up to 60s
  job_timeout_seconds: 900      # stop polling one job after this long
