<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidGen</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo">▶</span> VidGen</div>
    <a class="btn primary block" id="new-btn" href="#/new">+ New video</a>
    <a class="side-link" id="chars-link" href="#/characters">Characters <span id="char-count" class="muted"></span></a>
    <div class="side-head">Runs <span id="run-count" class="muted"></span></div>
    <nav id="runs" aria-label="Runs"></nav>
    <select id="runs-select" aria-label="Open a run"></select>
  </aside>

  <main id="main" tabindex="-1"></main>

  <section id="drawer" class="collapsed" aria-label="Jobs">
    <header id="drawer-bar">
      <button class="icon-btn" id="drawer-toggle" aria-expanded="false" title="Show jobs">▴</button>
      <span id="drawer-summary" class="muted">No jobs yet</span>
      <span id="drawer-progress" aria-hidden="true"></span>
    </header>
    <div id="drawer-body">
      <div id="log-pane">
        <div id="log-title" class="muted">Job log</div>
        <pre id="log" aria-live="polite"></pre>
      </div>
      <div id="job-list"></div>
    </div>
  </section>
</div>

<div id="modal-root"></div>
<div id="toasts" aria-live="assertive"></div>
<script src="app.js"></script>
</body>
</html>
