<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidGen</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <a class="brand" href="#/new" aria-label="VidGen, all formats"><span class="logo"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span><span class="brand-name">VidGen</span></a>
    <a class="btn primary block" id="new-btn" href="#/new"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span>New video</span></a>
    <a class="side-link" id="chars-link" href="#/characters"><span class="side-link-label"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Characters</span> <span id="char-count" class="muted"></span></a>
    <a class="side-link" id="screens-link" href="#/screens"><span class="side-link-label"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M11 18h2"/></svg>App screens</span> <span id="screen-count" class="muted"></span></a>
    <div class="side-head">Your videos <span id="run-count" class="muted"></span></div>
    <nav id="runs" aria-label="Your videos"></nav>
    <select id="runs-select" aria-label="Open a run"></select>
  </aside>

  <main id="main" tabindex="-1"></main>

  <section id="drawer" class="collapsed" aria-label="Jobs">
    <header id="drawer-bar">
      <button class="icon-btn" id="drawer-toggle" aria-expanded="false" title="Show jobs" aria-label="Show jobs"></button>
      <span id="drawer-summary" class="muted">No jobs yet</span>
      <span id="drawer-progress" aria-hidden="true"></span>
    </header>
    <div id="drawer-body">
      <div id="log-pane">
        <div id="log-title" class="muted">Job log</div>
        <pre id="log" aria-live="polite"></pre>
      </div>
      <div id="job-list"></div>
    </div>
  </section>
</div>

<div id="modal-root"></div>
<div id="toasts" aria-live="assertive"></div>
<script src="app.js"></script>
</body>
</html>
